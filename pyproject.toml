[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-toolkit"
version = "0.1.0"
description = "市场异象复现工具箱：预注册杀死条件 + HAC 检验 + 安慰剂对照"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "yfinance>=0.2",
    "akshare>=1.18",
]

[tool.setuptools.packages.find]
include = ["anomaly_toolkit*"]
